# Render Blueprint: New → Blueprint → pick this repository.
# Render's free plan has no persistent disk, so data lives in Neon (Postgres) and an
# S3-compatible bucket (Cloudflare R2 or Backblaze B2). Render asks for every `sync: false`
# value when the Blueprint is created; none of them are stored in git.
services:
  - type: web
    name: fs1-courses
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Cloudflare → Render edge → app
      - key: TRUST_PROXY
        value: '3'
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
