# Render Blueprint: New → Blueprint → pick this repository.
# Render's free plan has no persistent disk, so everything (including uploaded files) lives in
# the Neon Postgres database, as in UMS. Render asks for DATABASE_URL when the Blueprint is
# created; it is not stored in git.
services:
  - type: web
    name: fs1-courses
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Cloudflare → Render edge → app
      - key: TRUST_PROXY
        value: '3'
      - key: SESSION_SECRET
        generateValue: true
      # Files are stored in the database, so keep them small; share big files as links.
      - key: MAX_UPLOAD_MB
        value: '20'
      - key: DATABASE_URL
        sync: false
